[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mucaro-ai"
version = "0.1.23"
description = "Local-first planning-gated LLM lab with source-lineage RAG and CLI workflows."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn==0.48.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "jsonschema==4.26.0",
    "pypdf==6.21.1",
    "shapely==2.1.2",
    "pyproj==3.7.2",
    "rasterio==1.4.3",
    "geographiclib==2.1",
    "pillow==12.3.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic==0.75.0",
]
dev = [
    "httpx==0.28.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]
desktop = [
    "pywebview==6.2.1",
]
build-macos = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.7",
]

[project.scripts]
mucaro = "backend.app.cli:main"
mucaro-desktop = "backend.app.desktop_shell:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.app" = ["gis_grids/*.json", "gis_grids/*.md", "gis_grids/*.tif"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120
