[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mucaro-ai"
version = "0.1.23"
description = "Local-first planning-gated LLM lab with source-lineage RAG and CLI workflows."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.128.2",
    "uvicorn==0.48.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.29",
    "jsonschema==4.26.0",
    "pypdf==6.4.1",
    "shapely==2.1.2",
    "pyproj==3.7.2",
    "rasterio==1.4.3",
    "geographiclib==2.1",
]

[project.optional-dependencies]
anthropic = [
    "anthropic==0.75.0",
]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.2",
]

[project.scripts]
mucaro = "backend.app.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.app" = ["gis_grids/*.json", "gis_grids/*.md", "gis_grids/*.tif"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120
