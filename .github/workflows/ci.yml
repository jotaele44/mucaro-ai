name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org/
        working-directory: frontend
      - name: Certify release gates
        run: python scripts/certify_release.py
      - name: Provision immutable coding probe image
        id: coding_image
        run: |
          docker pull python:3.11-slim
          IMAGE="$(docker image inspect python:3.11-slim --format '{{index .RepoDigests 0}}')"
          test -n "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Certify live isolated coding container
        env:
          MUCARO_CODING_IMAGE: ${{ steps.coding_image.outputs.image }}
          MUCARO_CODING_RECEIPT: ${{ runner.temp }}/mucaro-coding-container-live.json
        run: python scripts/certify_coding_container_live.py --image "$MUCARO_CODING_IMAGE" --output "$MUCARO_CODING_RECEIPT"
      - name: Upload live coding-container receipt
        uses: actions/upload-artifact@v7
        with:
          name: coding-container-live-${{ github.sha }}
          path: ${{ runner.temp }}/mucaro-coding-container-live.json
          archive: false
      - name: Build dependency-complete coding image
        id: coding_full_image
        run: |
          BASE_IMAGE="$(docker image inspect python:3.11-slim --format '{{index .RepoDigests 0}}')"
          test -n "$BASE_IMAGE"
          docker build --build-arg BASE_IMAGE="$BASE_IMAGE" -f docker/coding.Dockerfile -t "mucaro-coding-full:${GITHUB_SHA}" .
          IMAGE_ID="$(docker image inspect "mucaro-coding-full:${GITHUB_SHA}" --format '{{.Id}}')"
          case "$IMAGE_ID" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "invalid immutable image id: $IMAGE_ID" >&2; exit 2 ;;
          esac
          echo "image=$IMAGE_ID" >> "$GITHUB_OUTPUT"
      - name: Certify full coding test lint type build profile
        env:
          MUCARO_CODING_FULL_IMAGE: ${{ steps.coding_full_image.outputs.image }}
          MUCARO_CODING_FULL_RECEIPT: ${{ runner.temp }}/mucaro-coding-full-profile.json
        run: python scripts/certify_coding_full_profile.py --image "$MUCARO_CODING_FULL_IMAGE" --output "$MUCARO_CODING_FULL_RECEIPT"
      - name: Upload full coding-profile receipt
        uses: actions/upload-artifact@v7
        with:
          name: coding-full-profile-${{ github.sha }}
          path: ${{ runner.temp }}/mucaro-coding-full-profile.json
          archive: false
      - name: Write hosted CI evidence receipt
        env:
          MUCARO_CI_RECEIPT: ${{ runner.temp }}/mucaro-hosted-ci-evidence.json
          MUCARO_CI_SHA: ${{ github.sha }}
          MUCARO_CI_RUN_ID: ${{ github.run_id }}
          MUCARO_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          MUCARO_CI_EVENT: ${{ github.event_name }}
          MUCARO_CI_REF: ${{ github.ref }}
          MUCARO_CI_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["MUCARO_CI_RECEIPT"])
          payload = {
              "schema_version": "mucaro-external-release-evidence/1.0",
              "head_sha": os.environ["MUCARO_CI_SHA"],
              "evidence": {
                  "ci_admitted": True,
                  "ci_passed": True,
                  "jobs_executed": True,
              },
              "github": {
                  "repository": os.environ["MUCARO_CI_REPOSITORY"],
                  "run_id": os.environ["MUCARO_CI_RUN_ID"],
                  "run_attempt": os.environ["MUCARO_CI_RUN_ATTEMPT"],
                  "event_name": os.environ["MUCARO_CI_EVENT"],
                  "ref": os.environ["MUCARO_CI_REF"],
                  "job": "validate",
              },
              "basis": "receipt emitted only after scripts/certify_release.py exits successfully in the admitted hosted validate job",
          }
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(path)
          PY
      - name: Upload hosted CI evidence receipt
        uses: actions/upload-artifact@v7
        with:
          name: hosted-ci-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/mucaro-hosted-ci-evidence.json
          archive: false
