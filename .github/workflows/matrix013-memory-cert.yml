name: MATRIX-013 Memory Certification

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "_architecture/memory_benchmark_v1.json"
      - "backend/app/memory.py"
      - "backend/app/memory_policy.py"
      - "backend/app/memory_benchmark.py"
      - "backend/app/auth.py"
      - "backend/tests/test_matrix013_memory_benchmark.py"
      - "scripts/certify_matrix013_memory.py"
      - ".github/workflows/matrix013-memory-cert.yml"
  push:
    branches:
      - main
    paths:
      - "_architecture/memory_benchmark_v1.json"
      - "backend/app/memory.py"
      - "backend/app/memory_policy.py"
      - "backend/app/memory_benchmark.py"
      - "backend/app/auth.py"
      - "backend/tests/test_matrix013_memory_benchmark.py"
      - "scripts/certify_matrix013_memory.py"
      - ".github/workflows/matrix013-memory-cert.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CERT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CERT_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Run MATRIX-013 regression
        run: python -m pytest backend/tests/test_matrix013_memory_benchmark.py -q
      - name: Certify frozen memory denominator
        run: python scripts/certify_matrix013_memory.py --head-sha "$CERT_SHA" --output-dir "$RUNNER_TEMP/matrix013"
      - name: Upload MATRIX-013 receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix013-memory-${{ env.CERT_SHA }}
          path: ${{ runner.temp }}/matrix013/matrix013-memory-receipt.json
          archive: false
          if-no-files-found: error
