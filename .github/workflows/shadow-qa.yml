name: Shadow QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  shadow-hardening:
    runs-on: ubuntu-latest
    env:
      SHADOW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      SHADOW_CHECKPOINT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHADOW_CHECKPOINT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify immutable checkpoint checkout
        run: test "$(git rev-parse HEAD)" = "$SHADOW_CHECKPOINT_SHA"
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org/
        working-directory: frontend
      - name: Run bounded Shadow QA
        env:
          MUCARO_SHADOW_RECEIPT: ${{ runner.temp }}/mucaro-shadow-qa-${{ env.SHADOW_CHECKPOINT_SHA }}.json
        run: python scripts/shadow_qa.py --base "$SHADOW_BASE_SHA" --head "$SHADOW_CHECKPOINT_SHA" --output "$MUCARO_SHADOW_RECEIPT"
      - name: Upload Shadow hardening receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow-qa-${{ env.SHADOW_CHECKPOINT_SHA }}
          path: ${{ runner.temp }}/mucaro-shadow-qa-${{ env.SHADOW_CHECKPOINT_SHA }}.json
          if-no-files-found: error
          archive: false
