name: Shadow QA

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional explicit base SHA; omit to use the latest successful main-push Shadow checkpoint
        required: false
        type: string
      checkpoint_sha:
        description: Exact frozen checkpoint SHA to audit
        required: true
        type: string
      evidence_manifest:
        description: Repository path to the checkpoint-bound evidence manifest
        required: true
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  shadow-hardening:
    runs-on: ubuntu-latest
    env:
      SHADOW_BASE_OVERRIDE: ${{ inputs.base_sha || '' }}
      SHADOW_CHECKPOINT_SHA: ${{ inputs.checkpoint_sha || github.sha }}
      SHADOW_EVIDENCE_MANIFEST: ${{ inputs.evidence_manifest || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.SHADOW_CHECKPOINT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve cumulative fail-closed Shadow baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RECEIPT: ${{ runner.temp }}/mucaro-shadow-baseline-${{ env.SHADOW_CHECKPOINT_SHA }}.json
        shell: bash
        run: |
          args=()
          if [ -n "$SHADOW_BASE_OVERRIDE" ]; then
            args+=(--base-override "$SHADOW_BASE_OVERRIDE")
          fi
          python scripts/resolve_shadow_baseline.py \
            --repository "$GITHUB_REPOSITORY" \
            --checkpoint "$SHADOW_CHECKPOINT_SHA" \
            --workflow "shadow-qa.yml" \
            --output "$BASELINE_RECEIPT" \
            "${args[@]}"
          BASE_SHA="$(python -c 'import json,os; print(json.load(open(os.environ["BASELINE_RECEIPT"], encoding="utf-8"))["base_sha"])')"
          echo "SHADOW_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
      - name: Verify immutable checkpoint and cumulative base
        run: |
          test -n "$SHADOW_BASE_SHA"
          test -n "$SHADOW_CHECKPOINT_SHA"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            test "$(git rev-parse HEAD)" = "$SHADOW_CHECKPOINT_SHA"
          fi
          test "$SHADOW_BASE_SHA" != "$SHADOW_CHECKPOINT_SHA"
          git cat-file -e "$SHADOW_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$SHADOW_BASE_SHA" "$SHADOW_CHECKPOINT_SHA"
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org/
        working-directory: frontend
      - name: Run bounded Shadow QA
        env:
          MUCARO_SHADOW_RECEIPT: ${{ runner.temp }}/mucaro-shadow-qa-${{ env.SHADOW_CHECKPOINT_SHA }}.json
        shell: bash
        run: |
          args=(--base "$SHADOW_BASE_SHA" --head "$SHADOW_CHECKPOINT_SHA" --output "$MUCARO_SHADOW_RECEIPT")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test -n "$SHADOW_EVIDENCE_MANIFEST"
            args+=(--historical-replay --evidence-manifest "$SHADOW_EVIDENCE_MANIFEST")
          fi
          python scripts/shadow_qa.py "${args[@]}"
      - name: Upload Shadow baseline receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow-baseline-${{ env.SHADOW_CHECKPOINT_SHA }}
          path: ${{ runner.temp }}/mucaro-shadow-baseline-${{ env.SHADOW_CHECKPOINT_SHA }}.json
          if-no-files-found: error
          archive: false
      - name: Upload Shadow hardening receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow-qa-${{ env.SHADOW_CHECKPOINT_SHA }}
          path: ${{ runner.temp }}/mucaro-shadow-qa-${{ env.SHADOW_CHECKPOINT_SHA }}.json
          if-no-files-found: error
          archive: false
