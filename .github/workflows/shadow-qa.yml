name: Shadow QA

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional explicit base SHA; omit to use the latest successful main-push Shadow checkpoint
        required: false
        type: string
      checkpoint_sha:
        description: Exact frozen checkpoint SHA to audit
        required: true
        type: string
      evidence_manifest_json:
        description: Inline checkpoint-bound Shadow vector evidence manifest JSON
        required: false
        type: string
      historical_replay:
        description: Preserve historical evidence without rerunning checkpoint code; can never certify PASS
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  shadow-hardening:
    runs-on: ubuntu-24.04
    env:
      SHADOW_BASE_OVERRIDE: ${{ inputs.base_sha || '' }}
      SHADOW_CHECKPOINT_SHA: ${{ inputs.checkpoint_sha || github.sha }}
      SHADOW_EVIDENCE_MANIFEST_JSON: ${{ inputs.evidence_manifest_json || '' }}
      SHADOW_HISTORICAL_REPLAY: ${{ inputs.historical_replay || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHADOW_CHECKPOINT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve cumulative fail-closed Shadow baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RECEIPT: ${{ runner.temp }}/mucaro-shadow-baseline-${{ env.SHADOW_CHECKPOINT_SHA }}.json
        shell: bash
        run: |
          args=()
          if [ -n "$SHADOW_BASE_OVERRIDE" ]; then
            args+=(--base-override "$SHADOW_BASE_OVERRIDE")
          fi
          python scripts/resolve_shadow_baseline.py \
            --repository "$GITHUB_REPOSITORY" \
            --checkpoint "$SHADOW_CHECKPOINT_SHA" \
            --workflow "shadow-qa.yml" \
            --output "$BASELINE_RECEIPT" \
            "${args[@]}"
          BASE_SHA="$(python -c 'import json,os; print(json.load(open(os.environ["BASELINE_RECEIPT"], encoding="utf-8"))["base_sha"])')"
          echo "SHADOW_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
      - name: Verify immutable checkpoint and cumulative base
        run: |
          test -n "$SHADOW_BASE_SHA"
          test -n "$SHADOW_CHECKPOINT_SHA"
          test "$(git rev-parse HEAD)" = "$SHADOW_CHECKPOINT_SHA"
          test "$SHADOW_BASE_SHA" != "$SHADOW_CHECKPOINT_SHA"
          git cat-file -e "$SHADOW_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$SHADOW_BASE_SHA" "$SHADOW_CHECKPOINT_SHA"
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org/
        working-directory: frontend
      - name: Materialize checkpoint-bound evidence manifest
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          test -n "$SHADOW_EVIDENCE_MANIFEST_JSON"
          SHADOW_EVIDENCE_MANIFEST_PATH="$RUNNER_TEMP/shadow-evidence-manifest.json"
          printf '%s\n' "$SHADOW_EVIDENCE_MANIFEST_JSON" > "$SHADOW_EVIDENCE_MANIFEST_PATH"
          python -m json.tool "$SHADOW_EVIDENCE_MANIFEST_PATH" >/dev/null
          echo "SHADOW_EVIDENCE_MANIFEST_PATH=$SHADOW_EVIDENCE_MANIFEST_PATH" >> "$GITHUB_ENV"
      - name: Install rendered QA harness and browser engines
        if: github.event_name == 'workflow_dispatch' && inputs.historical_replay != true
        working-directory: qa/rendered
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright install --with-deps webkit
      - name: Run exact-checkpoint rendered QA (Chromium)
        if: github.event_name == 'workflow_dispatch' && inputs.historical_replay != true
        working-directory: qa/rendered
        run: node rendered_qa.mjs --browser chromium --python "$(which python)" --out "$RUNNER_TEMP/shadow-rendered-chromium"
      - name: Run exact-checkpoint rendered QA (WebKit)
        if: github.event_name == 'workflow_dispatch' && inputs.historical_replay != true
        working-directory: qa/rendered
        run: node rendered_qa.mjs --browser webkit --python "$(which python)" --out "$RUNNER_TEMP/shadow-rendered-webkit"
      - name: Run bounded Shadow QA
        env:
          MUCARO_SHADOW_RECEIPT: ${{ runner.temp }}/mucaro-shadow-qa-${{ env.SHADOW_CHECKPOINT_SHA }}.json
        shell: bash
        run: |
          args=(--base "$SHADOW_BASE_SHA" --head "$SHADOW_CHECKPOINT_SHA" --output "$MUCARO_SHADOW_RECEIPT")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test -s "$SHADOW_EVIDENCE_MANIFEST_PATH"
            args+=(--evidence-manifest "$SHADOW_EVIDENCE_MANIFEST_PATH")
            if [ "$SHADOW_HISTORICAL_REPLAY" = "true" ]; then
              args+=(--historical-replay)
            else
              args+=(
                --execute-vector-evidence
                --rendered-receipt "$RUNNER_TEMP/shadow-rendered-chromium/receipt.json"
                --rendered-receipt "$RUNNER_TEMP/shadow-rendered-webkit/receipt.json"
              )
            fi
          fi
          python -m scripts.shadow_qa "${args[@]}"
      - name: Upload Shadow baseline receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow-baseline-${{ env.SHADOW_CHECKPOINT_SHA }}
          path: ${{ runner.temp }}/mucaro-shadow-baseline-${{ env.SHADOW_CHECKPOINT_SHA }}.json
          if-no-files-found: error
          archive: false
      - name: Upload Shadow hardening receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow-qa-${{ env.SHADOW_CHECKPOINT_SHA }}
          path: ${{ runner.temp }}/mucaro-shadow-qa-${{ env.SHADOW_CHECKPOINT_SHA }}.json
          if-no-files-found: error
          archive: false
      - name: Upload exact-checkpoint rendered Shadow evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.historical_replay != true
        uses: actions/upload-artifact@v7
        with:
          name: shadow-rendered-evidence-${{ env.SHADOW_CHECKPOINT_SHA }}
          path: |
            ${{ runner.temp }}/shadow-rendered-chromium
            ${{ runner.temp }}/shadow-rendered-webkit
          if-no-files-found: error
