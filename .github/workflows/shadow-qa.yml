name: Shadow QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  shadow-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org/
        working-directory: frontend
      - name: Run bounded Shadow QA
        env:
          MUCARO_SHADOW_RECEIPT: ${{ runner.temp }}/mucaro-shadow-qa-${{ github.sha }}.json
        run: python scripts/shadow_qa.py --base HEAD^ --head HEAD --output "$MUCARO_SHADOW_RECEIPT"
      - name: Upload Shadow hardening receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow-qa-${{ github.sha }}
          path: ${{ runner.temp }}/mucaro-shadow-qa-${{ github.sha }}.json
          if-no-files-found: error
          archive: false
