name: One-click setup

# Runs the real double-click files ("Mucaro AI.command" / "Mucaro AI.cmd") on clean runners.
# PATH is cut down to OS directories (plus tripwire stubs on macOS/Linux), so the job fails if
# setup ever depends on a preinstalled Python, Node, npm, or git.
# The macos-app job opens "Mucaro AI.app" through LaunchServices, as a Finder double-click does,
# and checks that it sets itself up and opens in its own window with no terminal or browser.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Mucaro AI.command"
      - "Mucaro AI.cmd"
      - "Mucaro AI.app/**"
      - "Fix-Gatekeeper.command"
      - ".gitattributes"
      - ".gitignore"
      - "scripts/one_click*"
      - "scripts/launch_app.py"
      - "scripts/verify_checkout_app.py"
      - "scripts/verify_macos_app.py"
      - "backend/app/desktop_shell.py"
      - "scripts/preflight.py"
      - "scripts/ingest_folder.py"
      - "pyproject.toml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/one-click-setup.yml"
  push:
    branches:
      - main
    paths:
      - "Mucaro AI.command"
      - "Mucaro AI.cmd"
      - "Mucaro AI.app/**"
      - "scripts/one_click*"
      - "scripts/launch_app.py"
      - "backend/app/desktop_shell.py"
      - "pyproject.toml"
      - "frontend/package-lock.json"
      - ".github/workflows/one-click-setup.yml"

permissions:
  contents: read

jobs:
  posix:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS arm64
          - os: macos-15-intel
            label: macOS Intel
          - os: ubuntu-latest
            label: Linux x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Prepare clean user environment
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/stubs"
          for tool in python python3 pip pip3 node npm npx git; do
            printf '#!/bin/sh\necho "%s $*" >> "%s/tripwire.txt"\nexit 99\n' "$tool" "$RUNNER_TEMP" > "$RUNNER_TEMP/stubs/$tool"
            chmod +x "$RUNNER_TEMP/stubs/$tool"
          done
      - name: First double-click (full setup, smoke launch)
        run: |
          set -o pipefail
          env -i HOME="$RUNNER_TEMP/home" PATH="$RUNNER_TEMP/stubs:/usr/bin:/bin:/usr/sbin:/sbin" TERM=dumb LANG=en_US.UTF-8 CI=true \
            "./Mucaro AI.command" --smoke-test --no-browser 2>&1 | tee "$RUNNER_TEMP/run1.log"
          grep -q "ONE_CLICK_SETUP_OK" "$RUNNER_TEMP/run1.log"
          grep -q "DESKTOP_SMOKE_OK" "$RUNNER_TEMP/run1.log"
      - name: Second double-click (fast path)
        run: |
          set -o pipefail
          start=$(date +%s)
          env -i HOME="$RUNNER_TEMP/home" PATH="$RUNNER_TEMP/stubs:/usr/bin:/bin:/usr/sbin:/sbin" TERM=dumb LANG=en_US.UTF-8 CI=true \
            "./Mucaro AI.command" --smoke-test --no-browser 2>&1 | tee "$RUNNER_TEMP/run2.log"
          elapsed=$(( $(date +%s) - start ))
          echo "second run took ${elapsed}s"
          grep -q "ONE_CLICK_FAST_PATH" "$RUNNER_TEMP/run2.log"
          grep -q "DESKTOP_SMOKE_OK" "$RUNNER_TEMP/run2.log"
          test "$elapsed" -lt 90
      - name: Verify isolation
        run: |
          if [ -s "$RUNNER_TEMP/tripwire.txt" ]; then echo "setup ran a PATH tool:"; cat "$RUNNER_TEMP/tripwire.txt"; exit 1; fi
          grep -q "^home = $(pwd -P)/.mucaro-runtime/python/" .venv/pyvenv.cfg
          test -z "$(ls -A "$RUNNER_TEMP/home")"
          test -z "$(git status --porcelain)"
      - name: Upload setup logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: one-click-logs-${{ matrix.os }}
          path: .mucaro-runtime/logs/
          if-no-files-found: ignore

  macos-app:
    name: Mucaro AI.app (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Open Mucaro AI.app the way Finder does (first run, full setup)
        # LaunchServices starts the app with the login session's environment, not this step's:
        # no terminal, and no PATH or tools from the runner.
        run: open "Mucaro AI.app"
      - name: Wait for the app to set itself up and open
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          shot=0
          for _ in $(seq 1 360); do
            if [ -s data/instance.json ]; then
              break
            fi
            if [ "$shot" = 0 ] && grep -qs '==> \[2/6\]' .mucaro-runtime/logs/setup-*.log; then
              # The Mucaro AI window is showing setup progress by now.
              sleep 5
              screencapture -x "$RUNNER_TEMP/evidence/first-run-progress.png" || true
              shot=1
            fi
            sleep 5
          done
          test -s data/instance.json
      - name: Verify window, GUI, samples, workflow, quit, and a fast second open
        run: |
          .venv/bin/python scripts/verify_checkout_app.py --head "$HEAD_SHA" \
            --output "$RUNNER_TEMP/evidence/checkout_app_receipt.json"
      - name: Verify isolation
        run: |
          grep -q "^home = $(pwd -P)/.mucaro-runtime/python/" .venv/pyvenv.cfg
          .venv/bin/python -c "import webview"
          test -z "$(git status --porcelain)"
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence/logs"
          cp .mucaro-runtime/logs/*.log "$RUNNER_TEMP/evidence/logs/" 2>/dev/null || true
          cp data/logs/*.log "$RUNNER_TEMP/evidence/logs/" 2>/dev/null || true
      - name: Upload screenshots, receipt and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mucaro-ai-app-evidence-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: First double-click (full setup, smoke launch)
        shell: cmd
        run: |
          set "PATH=%SystemRoot%\System32;%SystemRoot%;%SystemRoot%\System32\Wbem;%SystemRoot%\System32\WindowsPowerShell\v1.0"
          call "Mucaro AI.cmd" --smoke-test --no-browser > "%RUNNER_TEMP%\run1.log" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\run1.log"
          if not "%RC%"=="0" exit /b %RC%
          findstr /c:"ONE_CLICK_SETUP_OK" "%RUNNER_TEMP%\run1.log" || exit /b 1
          findstr /c:"DESKTOP_SMOKE_OK" "%RUNNER_TEMP%\run1.log" || exit /b 1
      - name: Second double-click (fast path)
        shell: cmd
        run: |
          set "PATH=%SystemRoot%\System32;%SystemRoot%;%SystemRoot%\System32\Wbem;%SystemRoot%\System32\WindowsPowerShell\v1.0"
          call "Mucaro AI.cmd" --smoke-test --no-browser > "%RUNNER_TEMP%\run2.log" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\run2.log"
          if not "%RC%"=="0" exit /b %RC%
          findstr /c:"ONE_CLICK_FAST_PATH" "%RUNNER_TEMP%\run2.log" || exit /b 1
          findstr /c:"DESKTOP_SMOKE_OK" "%RUNNER_TEMP%\run2.log" || exit /b 1
      - name: Verify isolation
        shell: pwsh
        run: |
          $cfg = Get-Content .venv\pyvenv.cfg | Where-Object { $_ -match '^home\s*=' }
          $expected = (Join-Path (Get-Location).Path ".mucaro-runtime\python\")
          if (-not ($cfg -replace '^home\s*=\s*', '').StartsWith($expected, [StringComparison]::OrdinalIgnoreCase)) { throw "venv is not on the private Python: $cfg" }
          $dirty = git status --porcelain
          if ($dirty) { throw "setup left tracked changes:`n$dirty" }
      - name: Upload setup logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: one-click-logs-windows
          path: .mucaro-runtime/logs/
          if-no-files-found: ignore
