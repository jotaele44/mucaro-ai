name: RT09 Real World Retrieval Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "_architecture/retrieval_real_world_corpus_v1.json"
      - "scripts/certify_retrieval_real_world_live.py"
      - "backend/tests/test_rt09_real_world_corpus.py"
      - ".github/workflows/rt09-real-world-cert.yml"
  push:
    branches: [main]
    paths:
      - "_architecture/retrieval_real_world_corpus_v1.json"
      - "scripts/certify_retrieval_real_world_live.py"
      - ".github/workflows/rt09-real-world-cert.yml"

permissions:
  contents: read

jobs:
  certify-real-world-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install Mucaro
        run: python -m pip install -e ".[dev]"
      - name: Validate RT09 denominator
        run: python -m pytest backend/tests/test_rt09_real_world_corpus.py backend/tests/test_retrieval_corpus_certification.py backend/tests/test_retrieval_corpus_materializer.py -q
      - name: Acquire and certify real-world corpus
        env:
          RT09_OUT: ${{ runner.temp }}/rt09
        run: python scripts/certify_retrieval_real_world_live.py --output-dir "$RT09_OUT"
      - name: Upload frozen RT09 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rt09-real-world-corpus-${{ github.sha }}
          path: ${{ runner.temp }}/rt09
          archive: true
