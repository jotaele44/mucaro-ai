name: Web Render Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/app/web_render.py"
      - "backend/tests/test_web_render.py"
      - "scripts/certify_web_render_live.py"
      - "backend/tests/test_web_render_live_cert.py"
      - ".github/workflows/web-render-cert.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/web_render.py"
      - "scripts/certify_web_render_live.py"
      - ".github/workflows/web-render-cert.yml"

permissions:
  contents: read

jobs:
  certify-rendered-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install Mucaro and Playwright
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Run rendered-browser source regressions
        run: python -m pytest backend/tests/test_web_render.py backend/tests/test_web_render_live_cert.py -q
      - name: Execute live rendered-browser certification
        env:
          MUCARO_WEB_RENDER_RECEIPT: ${{ runner.temp }}/mucaro-web-render-live.json
        run: python scripts/certify_web_render_live.py --url "https://example.com/" --output "$MUCARO_WEB_RENDER_RECEIPT"
      - name: Upload rendered-browser evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-render-live-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mucaro-web-render-live.json
            data/exports/web_renders/*.json
            data/exports/web_renders/*.png
