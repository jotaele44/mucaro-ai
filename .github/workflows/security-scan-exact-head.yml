name: Security Scan Exact-Head
on:
  pull_request:
    paths:
      - "backend/app/security_scan.py"
      - "backend/app/main.py"
      - "backend/app/models.py"
      - "backend/tests/test_security_scan.py"
      - "frontend/src/**"
      - ".github/workflows/security-scan-exact-head.yml"

permissions:
  contents: read

jobs:
  exact-head-security:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact checkout identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "Exact head: $EXPECTED_HEAD"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Execute security and permission regression denominators
        run: python -m pytest backend/tests/test_security_scan.py backend/tests/test_coding_workspace.py backend/tests/test_api.py -q
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --registry=https://registry.npmjs.org/
          npm run build
      - name: Assert pinned HEAD after tests
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          echo "EXACT_HEAD_SECURITY_TESTS_PASS=$EXPECTED_HEAD"
