name: MATRIX-011 Tool-Governance Certification

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "_architecture/tool_governance_benchmark_v1.json"
      - "backend/app/tool_governance_benchmark.py"
      - "backend/app/memory_benchmark.py"
      - "backend/app/recovery_benchmark.py"
      - "backend/app/permission_engine.py"
      - "backend/app/permissions.py"
      - "backend/app/permission_leases.py"
      - "backend/app/capability_policy.py"
      - "backend/app/distribution_policy.py"
      - "backend/app/tool_execution_policy.py"
      - "backend/app/tools.py"
      - "backend/app/work_runs.py"
      - "backend/app/model_router.py"
      - "backend/app/web_browsing.py"
      - "backend/app/web_search.py"
      - "backend/tests/test_matrix011_tool_governance_benchmark.py"
      - "scripts/certify_matrix011_tool_governance.py"
      - ".github/workflows/matrix011-tool-governance-cert.yml"
  push:
    branches:
      - main
    paths:
      - "_architecture/tool_governance_benchmark_v1.json"
      - "backend/app/tool_governance_benchmark.py"
      - "backend/app/memory_benchmark.py"
      - "backend/app/recovery_benchmark.py"
      - "backend/app/permission_engine.py"
      - "backend/app/permissions.py"
      - "backend/app/permission_leases.py"
      - "backend/app/capability_policy.py"
      - "backend/app/distribution_policy.py"
      - "backend/app/tool_execution_policy.py"
      - "backend/app/tools.py"
      - "backend/app/work_runs.py"
      - "backend/app/model_router.py"
      - "backend/app/web_browsing.py"
      - "backend/app/web_search.py"
      - "backend/tests/test_matrix011_tool_governance_benchmark.py"
      - "scripts/certify_matrix011_tool_governance.py"
      - ".github/workflows/matrix011-tool-governance-cert.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CERT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CERT_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Run MATRIX-011 regression
        run: python -m pytest backend/tests/test_matrix011_tool_governance_benchmark.py -q
      - name: Certify frozen tool-governance denominator
        run: python scripts/certify_matrix011_tool_governance.py --head-sha "$CERT_SHA" --output-dir "$RUNNER_TEMP/matrix011"
      - name: Upload MATRIX-011 receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix011-tool-governance-${{ env.CERT_SHA }}
          path: ${{ runner.temp }}/matrix011/matrix011-tool-governance-receipt.json
          archive: false
          if-no-files-found: error
