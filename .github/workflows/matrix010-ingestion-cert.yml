name: MATRIX-010 Ingestion Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "_architecture/ingest_format_registry_v1.json"
      - "_architecture/ingestion_benchmark_v1.json"
      - "backend/app/archive_safety.py"
      - "backend/app/file_signatures.py"
      - "backend/app/format_registry.py"
      - "backend/app/ingestion.py"
      - "backend/app/ingestion_benchmark.py"
      - "backend/app/multimodal.py"
      - "backend/app/parser.py"
      - "backend/tests/test_matrix010_ingestion_benchmark.py"
      - "scripts/certify_matrix010_ingestion.py"
      - ".github/workflows/matrix010-ingestion-cert.yml"
  push:
    branches:
      - main
    paths:
      - "_architecture/ingest_format_registry_v1.json"
      - "_architecture/ingestion_benchmark_v1.json"
      - "backend/app/archive_safety.py"
      - "backend/app/file_signatures.py"
      - "backend/app/format_registry.py"
      - "backend/app/ingestion.py"
      - "backend/app/ingestion_benchmark.py"
      - "backend/app/multimodal.py"
      - "backend/app/parser.py"
      - "backend/tests/test_matrix010_ingestion_benchmark.py"
      - "scripts/certify_matrix010_ingestion.py"
      - ".github/workflows/matrix010-ingestion-cert.yml"

jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      CERT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CERT_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Run MATRIX-010 regression
        run: python -m pytest backend/tests/test_matrix010_ingestion_benchmark.py -q
      - name: Certify frozen ingestion denominator
        run: python scripts/certify_matrix010_ingestion.py --head-sha "$CERT_SHA" --output-dir "$RUNNER_TEMP/matrix010"
      - name: Upload MATRIX-010 receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix010-ingestion-${{ env.CERT_SHA }}
          path: ${{ runner.temp }}/matrix010/matrix010-ingestion-receipt.json
          archive: false
          if-no-files-found: error
