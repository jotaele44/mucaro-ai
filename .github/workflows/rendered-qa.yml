name: Rendered UI QA

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/app/**"
      - "qa/rendered/**"
      - ".github/workflows/rendered-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-qa:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install QA harness and browser engine
        working-directory: qa/rendered
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run rendered QA (desktop 1440x900, iPhone 390x844)
        working-directory: qa/rendered
        run: node rendered_qa.mjs --browser "${{ matrix.browser }}" --python "$(which python)" --out "$RUNNER_TEMP/rendered-qa-${{ matrix.browser }}"
      - name: Upload screenshots and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rendered-qa-${{ matrix.browser }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rendered-qa-${{ matrix.browser }}
          if-no-files-found: warn
