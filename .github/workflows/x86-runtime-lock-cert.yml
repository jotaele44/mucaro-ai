name: x86_64 Portable Runtime Lock Certification

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "packaging/runtime/requirements-macos-x86_64.lock"
      - ".github/workflows/x86-runtime-lock-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-x86-runtime-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_VERSION: "0.10.0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned uv resolver
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Resolve Python 3.13 x86_64 macOS wheel-only dependency lock
        env:
          OUT: ${{ runner.temp }}/x86-runtime-lock
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          uv pip compile pyproject.toml \
            --python-version 3.13 \
            --python-platform x86_64-apple-darwin \
            --generate-hashes \
            --only-binary :all: \
            --output-file "$OUT/requirements-macos-x86_64.lock"
          test -s "$OUT/requirements-macos-x86_64.lock"
          sha256sum "$OUT/requirements-macos-x86_64.lock"
          cat "$OUT/requirements-macos-x86_64.lock"

      - name: Upload exact-head x86_64 lock evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: x86-runtime-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/x86-runtime-lock
          if-no-files-found: error
          archive: true
